<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>So bereiten Sie das Gelenk-Elixier zu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --green: #00e676;
        --green-dark: #008f46;
        --text: #f2f5f3;
        --muted: #aebbb4;
        --surface: #0b100d;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        font-family: "Poppins", sans-serif;
        background: radial-gradient(circle at 12% 0%, rgba(0, 255, 110, .08), transparent 24rem), linear-gradient(155deg, #020504 0%, #050706 55%, #0b140e 100%);
      }
      .video-page { width: min(860px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 56px; }
      .back-link { display: inline-flex; margin-bottom: 28px; padding: 9px 16px; border: 1px solid rgba(0, 230, 118, .45); border-radius: 999px; color: var(--green); font-size: .88rem; font-weight: 600; text-decoration: none; }
      .video-card { padding: clamp(20px, 4vw, 38px); border: 1px solid rgba(0, 255, 117, .2); border-radius: 28px; background: linear-gradient(145deg, rgba(21, 27, 23, .96), rgba(8, 12, 10, .96)); box-shadow: 0 24px 60px rgba(0, 0, 0, .42), 0 0 28px rgba(0, 255, 110, .05); }
      .eyebrow { margin: 0 0 8px; color: var(--green); font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 0 0 12px; font-size: clamp(1.55rem, 4vw, 2.35rem); line-height: 1.2; }
      .intro { margin: 0 0 26px; color: var(--muted); line-height: 1.7; }
      .video-frame { overflow: hidden; border: 1px solid rgba(0, 230, 118, .35); border-radius: 20px; background: #000; box-shadow: 0 18px 42px rgba(0, 0, 0, .45); }
      video { display: block; width: 100%; height: auto; }
      .recipe-link { display: flex; justify-content: center; margin-top: 22px; padding: 13px 20px; border-radius: 12px; color: #041008; background: linear-gradient(135deg, var(--green), var(--green-dark)); font-weight: 700; text-align: center; text-decoration: none; box-shadow: 0 10px 22px rgba(0, 230, 118, .16); }
      .note { margin: 18px 0 0; color: var(--muted); font-size: .88rem; line-height: 1.6; text-align: center; }
      @media (max-width: 600px) { .video-page { width: calc(100% - 20px); padding-top: 16px; } .video-card { padding: 20px 14px 22px; border-radius: 22px; } .video-frame { border-radius: 16px; } }
    </style>
  </head>
  <body>
    <main class="video-page">
      <a class="back-link" href="index.html">← Zurück zu den Inhalten</a>
      <section class="video-card" aria-labelledby="video-title">
        <p class="eyebrow">Videokurs</p>
        <h1 id="video-title">So bereiten Sie das Gelenk-Elixier zu</h1>
        <p class="intro">Sehen Sie sich die Lektion an und lernen Sie, wie Sie Ihr Rezept einfach und praktisch zubereiten.</p>
        <div class="video-frame">
          <video controls playsinline preload="metadata" poster="image/videokurs.png">
            <source src="video/gelenk-elixier-rezept.mp4" type="video/mp4" />
            Ihr Browser kann dieses Video leider nicht abspielen.
          </video>
        </div>
        <a class="recipe-link" href="pdf/gelenk-elixier-rezept.pdf" target="_blank" rel="noopener">Rezept lesen</a>
        <p class="note">Gehen Sie jeden Schritt in Ihrem eigenen Tempo durch und schauen Sie jederzeit ins PDF.</p>
      </section>
    </main>
  </body>
</html>
